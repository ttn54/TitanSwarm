name: Deploy to DigitalOcean

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd TitanSwarm
            git fetch origin && git reset --hard origin/master
            [ -f .env ] || { echo "ERROR: .env missing"; exit 1; }
            # Stop first (defeats restart:unless-stopped), then remove
            docker compose down --remove-orphans 2>/dev/null || true
            docker stop titanswarm_ui titanswarm_daemon 2>/dev/null || true
            docker rm -f titanswarm_ui titanswarm_daemon 2>/dev/null || true
            docker compose up -d --build
            docker ps --format '{{.Names}}  {{.Status}}'
